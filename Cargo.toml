[package]
name = "hwpx2html"
version = "0.10.0"
edition = "2021"
description = "Convert HWPX documents to self-contained HTML"
license = "MIT"
repository = "https://github.com/everydaymind/hwpx2html"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
walkdir = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
